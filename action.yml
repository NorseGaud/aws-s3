name: "Deploy Docusaurus to AWS S3"
description: "Builds and syncs Docusaurus site to Amazon S3 bucket"
author: docuactions

inputs:
  aws-region:
    description: 'AWS Region for S3 bucket'
    required: true
  aws-s3-bucket:
    description: 'S3 bucket name to sync to'
    required: true
  cloudfront-distribution-id:
    description: 'CloudFront distribution ID to invalidate (optional)'
    required: false
    default: ''
  build-dir:
    description: 'Build output directory'
    required: false
    default: 'build'
  source-dir:
    description: 'Source directory (defaults to workspace root)'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      run: |
        echo "Installing yarn globally..."
        npm install -g yarn
        echo "Installing dependencies..."
        yarn install

    - name: Build Docusaurus site
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      run: |
        echo "Building Docusaurus site..."
        yarn run build

    - name: Sync to S3
      shell: bash
      working-directory: ${{ inputs.source-dir }}
      run: |
        echo "Syncing ${{ inputs.build-dir }} to s3://${{ inputs.aws-s3-bucket }}..."
        aws s3 sync ./${{ inputs.build-dir }} s3://${{ inputs.aws-s3-bucket }} \
          --exact-timestamps \
          --delete \
          --region ${{ inputs.aws-region }}
        echo "S3 sync complete!"

    - name: Invalidate CloudFront cache
      if: ${{ inputs.cloudfront-distribution-id != '' }}
      shell: bash
      run: |
        echo "Creating CloudFront invalidation for distribution ${{ inputs.cloudfront-distribution-id }}..."
        INVALIDATION_ID=$(aws cloudfront create-invalidation \
          --distribution-id ${{ inputs.cloudfront-distribution-id }} \
          --paths "/*" \
          --query 'Invalidation.Id' \
          --output text)
        echo "CloudFront invalidation created: $INVALIDATION_ID"
        echo "Cache invalidation in progress. This may take a few minutes to complete."

branding:
  icon: refresh-cw
  color: green